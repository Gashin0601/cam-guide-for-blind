<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Cam Guide — webcam position assistant UI</title>
<desc>UI mockup showing sidebar with navigation and main panel with live camera check, face detection overlay, feedback card, and position check grid</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <clipPath id="camClip">
    <rect x="215" y="100" width="445" height="180" rx="10"/>
  </clipPath>
  <clipPath id="appClip">
    <rect x="0" y="0" width="680" height="520" rx="14"/>
  </clipPath>
</defs>

<!-- App background -->
<rect x="0" y="0" width="680" height="520" rx="14" fill="#ffffff" stroke="#e0ddd4" stroke-width="0.5"/>

<!-- Sidebar background -->
<rect x="0" y="0" width="190" height="520" rx="0" fill="#f8f8f6" clip-path="url(#appClip)"/>
<rect x="189.75" y="0" width="0.5" height="520" fill="#e0ddd4"/>

<!-- Logo icon -->
<rect x="18" y="18" width="30" height="30" rx="9" fill="#1D9E75"/>
<circle cx="33" cy="29" r="6" fill="none" stroke="white" stroke-width="1.5"/>
<path d="M24 44 Q24 38 33 37 Q42 38 42 44" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

<!-- Logo text -->
<text x="56" y="37" class="th" fill="#1a1a1a" font-family="sans-serif" font-size="14" font-weight="600">Cam Guide</text>

<!-- Nav: Live check (active) -->
<rect x="10" y="62" width="170" height="34" rx="8" fill="#ffffff" stroke="#e0ddd4" stroke-width="0.5"/>
<circle cx="28" cy="79" r="5" fill="#1D9E75"/>
<text x="42" y="83" font-family="sans-serif" font-size="13" font-weight="500" fill="#1a1a1a">Live check</text>

<!-- Nav: History -->
<circle cx="28" cy="115" r="5" fill="#cccccc"/>
<text x="42" y="119" font-family="sans-serif" font-size="13" fill="#888888">History</text>

<!-- Nav: Settings -->
<circle cx="28" cy="145" r="5" fill="#cccccc"/>
<text x="42" y="149" font-family="sans-serif" font-size="13" fill="#888888">Settings</text>

<!-- Streak box -->
<rect x="10" y="420" width="170" height="80" rx="8" fill="#ffffff" stroke="#e0ddd4" stroke-width="0.5"/>
<text x="22" y="440" font-family="sans-serif" font-size="10" fill="#aaaaaa" letter-spacing="0.05em">GOOD SESSIONS</text>
<text x="22" y="468" font-family="sans-serif" font-size="26" font-weight="600" fill="#1a1a1a">3</text>
<text x="22" y="486" font-family="sans-serif" font-size="11" fill="#888888">3-day streak</text>

<!-- MAIN AREA -->

<!-- Section label -->
<text x="215" y="30" font-family="sans-serif" font-size="10" font-weight="600" fill="#1D9E75" letter-spacing="0.08em">LIVE CHECK</text>

<!-- Page title -->
<text x="215" y="52" font-family="sans-serif" font-size="18" font-weight="600" fill="#1a1a1a">How's your camera looking?</text>

<!-- Page subtitle -->
<text x="215" y="70" font-family="sans-serif" font-size="12" fill="#888888">Audio feedback plays automatically. No screen needed.</text>

<!-- Camera area background -->
<rect x="215" y="84" width="445" height="182" rx="10" fill="#141414"/>

<!-- Grid lines inside camera -->
<line x1="363" y1="84" x2="363" y2="266" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
<line x1="511" y1="84" x2="511" y2="266" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
<line x1="215" y1="144" x2="660" y2="144" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
<line x1="215" y1="205" x2="660" y2="205" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>

<!-- Silhouette (person outline, subtle) -->
<ellipse cx="437" cy="148" rx="34" ry="40" fill="white" opacity="0.12"/>
<path d="M395 270 Q395 220 437 214 Q479 220 479 270Z" fill="white" opacity="0.12"/>

<!-- Face detection box (green, tracking) -->
<rect x="408" y="106" width="58" height="72" rx="6" fill="none" stroke="#1D9E75" stroke-width="1.8"/>
<!-- Corner accents TL -->
<path d="M408 120 L408 106 L422 106" fill="none" stroke="#5DCAA5" stroke-width="2.5" stroke-linecap="round"/>
<!-- Corner accent BR -->
<path d="M466 152 L466 178 L452 178" fill="none" stroke="#5DCAA5" stroke-width="2.5" stroke-linecap="round"/>

<!-- Center cross -->
<line x1="427" y1="172" x2="447" y2="172" stroke="rgba(255,255,255,0.18)" stroke-width="0.5"/>
<line x1="437" y1="162" x2="437" y2="182" stroke="rgba(255,255,255,0.18)" stroke-width="0.5"/>

<!-- Status pill -->
<rect x="598" y="92" width="54" height="20" rx="10" fill="#085041"/>
<text x="625" y="106" font-family="sans-serif" font-size="10" font-weight="500" fill="#9FE1CB" text-anchor="middle">Face found</text>

<!-- Camera label bottom -->
<rect x="370" y="255" width="133" height="18" rx="9" fill="rgba(0,0,0,0.35)"/>
<text x="437" y="268" font-family="sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Live webcam</text>

<!-- FEEDBACK CARD (warning state) -->
<rect x="215" y="278" width="445" height="76" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>

<!-- Warning icon circle -->
<circle cx="247" cy="316" r="17" fill="#FAC775"/>
<text x="247" y="322" font-family="sans-serif" font-size="15" font-weight="600" fill="#633806" text-anchor="middle">↑</text>

<!-- Feedback text -->
<text x="274" y="305" font-family="sans-serif" font-size="13" font-weight="600" fill="#633806">Look slightly higher</text>
<text x="274" y="322" font-family="sans-serif" font-size="12" fill="#854F0B">Your face is a bit low — tilt your screen or raise your chair.</text>

<!-- Audio wave indicator -->
<rect x="274" y="334" width="2" height="6" rx="1" fill="#EF9F27"/>
<rect x="279" y="330" width="2" height="10" rx="1" fill="#EF9F27"/>
<rect x="284" y="333" width="2" height="7" rx="1" fill="#EF9F27"/>
<rect x="289" y="328" width="2" height="12" rx="1" fill="#EF9F27"/>
<rect x="294" y="335" width="2" height="5" rx="1" fill="#EF9F27"/>
<text x="302" y="341" font-family="sans-serif" font-size="11" fill="#854F0B">Speaking via audio</text>

<!-- CHECKS GRID 2x2 -->
<!-- Check 1: Face in frame (ok) -->
<rect x="215" y="366" width="214" height="36" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<circle cx="233" cy="384" r="5" fill="#1D9E75"/>
<text x="246" y="388" font-family="sans-serif" font-size="12" fill="#085041">Face in frame</text>

<!-- Check 2: Centered (ok) -->
<rect x="440" y="366" width="220" height="36" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<circle cx="458" cy="384" r="5" fill="#1D9E75"/>
<text x="471" y="388" font-family="sans-serif" font-size="12" fill="#085041">Centered left-right</text>

<!-- Check 3: Head angle (warn) -->
<rect x="215" y="412" width="214" height="36" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<circle cx="233" cy="430" r="5" fill="#EF9F27"/>
<text x="246" y="434" font-family="sans-serif" font-size="12" fill="#633806">Head angle — adjust</text>

<!-- Check 4: Lighting (ok) -->
<rect x="440" y="412" width="220" height="36" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<circle cx="458" cy="430" r="5" fill="#1D9E75"/>
<text x="471" y="434" font-family="sans-serif" font-size="12" fill="#085041">Lighting okay</text>

<!-- Mute button -->
<rect x="215" y="462" width="142" height="30" rx="8" fill="none" stroke="#e0ddd4" stroke-width="0.5"/>
<text x="286" y="481" font-family="sans-serif" font-size="12" fill="#888888" text-anchor="middle">Audio feedback: ON</text>

<!-- Outer border -->
<rect x="0.25" y="0.25" width="679.5" height="519.5" rx="13.75" fill="none" stroke="#e0ddd4" stroke-width="0.5"/>

</svg>
